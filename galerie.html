<!DOCTYPE html>
<html lang="de">
<head>

    <!-- Seite passt sich der Bildschirmbreite an-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galerie – Mein Lieblingsobjekt</title>

    <!-- nur noch eine Schrift, Albert Sans, in den Stärken 300 bis 600 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&display=swap">

    <!-- Mein CSS und mein JS (defer = JS erst starten, wenn die Seite geladen ist) -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<!-- Navigation: auf allen Seiten gleich -->
<header>
    <!-- Zusatztext im span, weil er kleiner und grau ist -->
    <a href="index.html" class="logo">AE-1 <span>Mein Augenblickfänger</span></a>

    <nav>
        <!-- aria-current="page" markiert die Seite, auf der ich gerade bin -->
        <a href="index.html">Kamera</a>
        <a href="galerie.html" aria-current="page">Galerie</a>
        <a href="ueber-mich.html">Über mich</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
    <!-- Hell/Dunkel-Schalter, bekommt in Schritt 5 seine Funktion -->
    <button id="theme" type="button" aria-label="Hell oder Dunkelmodus"></button>
</header>

<!-- Hauptinhalt: ist auf jeder Seite anders -->
<main>

    <!-- Einleitung -->
    <section class="intro">
        <p class="label">Die Galerie</p>
        <h1>Entwickle meine Bilder</h1>
        <p>Klicke auf ein Negativ, um es zu entwickeln. Nach zehn Sekunden zeigt sich, was ich damals gesehen habe.</p>
    </section>

    <!-- Werkzeugleiste: Fortschritt und zwei Buttons -->
    <div class="werkzeuge">
        <!-- progress = fertiger Fortschrittsbalken vom Browser -->
        <progress id="fortschritt" value="0" max="16"></progress>
        <p><span id="zaehler">0</span> / 16 entwickelt</p>
        <button id="alle-entwickeln" class="button" type="button">Alle entwickeln</button>
        <button id="alle-zurueck" class="button button-rand" type="button">Alle zurück zum Negativ</button>
    </div>

    <!-- Die 16 Fotos -->
    <div class="fotos">
        <!-- button = man kann draufklicken (auch mit der Tastatur) -->
        <button class="foto" type="button">
            <img src="img/bild_1.JPG" alt="Freunde liegen im Schnee">
            <span>Negativ 01</span>
            <!-- je nachdem ob entwickelt, zeigt das CSS den einen oder den anderen Text -->
            <span class="hinweis">Klicken zum Entwickeln</span>
            <span class="info">Flims, Schweiz · 2026</span>
        </button>
        <button class="foto" type="button">
            <img src="img/bild_2.JPG" alt="Marktstand in Suzhou">
